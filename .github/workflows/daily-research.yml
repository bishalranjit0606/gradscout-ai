name: Daily GenAI Master's Research

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  research:
    name: Discover and email new programs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore seen programs cache
        uses: actions/cache@v4
        with:
          path: seen_programs.json
          key: program-cache-${{ github.run_id }}
          restore-keys: |
            program-cache-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run research agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u main.py
